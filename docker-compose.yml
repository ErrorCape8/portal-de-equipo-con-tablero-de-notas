services:
  mysql:
    image: mysql:8.0
    container_name: portal-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portal_db
      MYSQL_USER: portal_user
      MYSQL_PASSWORD: portal_pass
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
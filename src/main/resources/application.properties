spring.application.name=tablerodenotas
spring.datasource.url=jdbc:mysql://localhost:3307/portal_db
spring.datasource.username=portal_user
spring.datasource.password=portal_pass
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

server.port=8080

app.jwt.secret=dev-only-secret-key-with-at-least-32-characters
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=http://localhost:3000

app.aws.region=us-east-1
app.aws.lambda.dashboard-metrics-function=dashboard-metrics

app.aws.lambda-endpoint=http://localhost:4566
app.aws.access-key=test
app.aws.secret-key=test

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true